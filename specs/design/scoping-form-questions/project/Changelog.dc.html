<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;padding:0}
    a{color:var(--k-accent-text);text-decoration:none}a:hover{opacity:.82}
    ::selection{background:var(--k-accent);color:var(--k-on-accent)}
  @media(max-width:900px){[data-navlinks]{display:none!important}[data-navsep]{display:none!important}[data-hamburger]{display:flex!important}}@media(max-width:520px){[data-ddname]{display:none!important}}@media(max-width:620px){[data-entry]{grid-template-columns:1fr!important;gap:10px!important}}</style>
</helmet>
<div id="kuber-root" style="--k-bg:#000000;--k-card:#0D0D10;--k-muted:#18181B;--k-border:#27272A;--k-border-muted:#3F3F46;--k-text:#FAFAFA;--k-text-sec:#A1A1AA;--k-accent:#3B82F6;--k-accent-subtle:rgba(59,130,246,.14);--k-accent-ring:rgba(59,130,246,.30);--k-on-accent:#FFFFFF;--k-accent-text:#3B82F6;--k-income:#22C55E;--k-income-subtle:rgba(34,197,94,.14);--k-expense:#EF4444;--k-expense-subtle:rgba(239,68,68,.14);--k-warning:#F59E0B;--k-tile:#0E397C;font-family:'Inter',system-ui,sans-serif;background:var(--k-bg);color:var(--k-text);min-height:100vh;transition:background .35s,color .35s">

  <nav style="position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--k-bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--k-border)">
    <div style="max-width:1160px;margin:0 auto;padding:0 22px;height:64px;display:flex;align-items:center;gap:20px">
      <a href="Homepage.dc.html" style="display:flex;align-items:center;gap:10px;color:var(--k-text)">
        <svg width="30" height="30" viewBox="0 0 512 512" style="border-radius:8px"><rect width="512" height="512" fill="var(--k-tile)"/><circle cx="256" cy="256" r="190" fill="var(--k-accent)"/><path fill="var(--k-tile)" d="M176 150H335V172H176ZM176 150H303V178H176ZM259 177H306L316 199H281ZM176 199H335V222H176ZM283 222H315L307 246H259ZM202 245H306L293 260L276 270L247 275H202ZM202 275H247L326 360L280 361Z"/></svg>
        <span style="font:800 19px Inter;letter-spacing:-.4px">Kuber</span>
      </a>
      <div style="flex:1"></div>
      <div style="display:flex;align-items:center;gap:26px" data-navlinks>
        <a href="Features.dc.html" style="font:600 14.5px Inter;color:var(--k-text-sec)">Features</a>
        <a href="Docs.dc.html" style="font:600 14.5px Inter;color:var(--k-text-sec)">Docs</a>
        <a href="Changelog.dc.html" style="font:600 14.5px Inter;color:var(--k-accent-text)">Changelog</a>
        <a href="About.dc.html" style="font:600 14.5px Inter;color:var(--k-text-sec)">About</a>
        <a href="Press.dc.html" style="font:600 14.5px Inter;color:var(--k-text-sec)">Press</a>
      </div>
      <div style="width:1px;height:24px;background:var(--k-border)" data-navsep></div>
      <div style="position:relative" data-themedd>
        <button onClick="{{ toggleThemeMenu }}" aria-label="Theme" style="display:flex;align-items:center;gap:9px;background:var(--k-muted);border:1px solid var(--k-border);border-radius:999px;padding:6px 11px 6px 9px;cursor:pointer;color:var(--k-text)">
          <span style="width:16px;height:16px;border-radius:999px;background:{{ currentSwatch }};border:1px solid var(--k-border-muted)"></span>
          <span style="font:600 13px Inter" data-ddname>{{ currentName }}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <sc-if value="{{ themeMenuOpen }}" hint-placeholder-val="{{ false }}">
          <div onClick="{{ closeThemeMenu }}" style="position:fixed;inset:0;z-index:65"></div>
          <div style="position:absolute;top:46px;right:0;z-index:70;width:236px;background:var(--k-card);border:1px solid var(--k-border);border-radius:14px;padding:8px" data-ddpanel>
            <div style="display:flex;gap:6px;margin-bottom:6px">
              <button onClick="{{ setLight }}" style="{{ lightBtnStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>Light</button>
              <button onClick="{{ setDark }}" style="{{ darkBtnStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>Dark</button>
            </div>
            <div style="height:1px;background:var(--k-border);margin:0 2px 6px"></div>
            <sc-for list="{{ themes }}" as="t" hint-placeholder-count="7">
              <button onClick="{{ t.select }}" style="{{ t.rowStyle }}">
                <span style="width:16px;height:16px;border-radius:999px;background:{{ t.color }};flex-shrink:0"></span>
                <span style="flex:1;text-align:left;font:600 13.5px Inter;color:var(--k-text)">{{ t.name }}</span>
                <span style="font:500 11px Inter;color:var(--k-text-sec)">{{ t.label }}</span>
              </button>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <button onClick="{{ toggleMenu }}" aria-label="Menu" style="display:none;background:var(--k-muted);border:1px solid var(--k-border);border-radius:8px;width:40px;height:40px;color:var(--k-text);cursor:pointer;align-items:center;justify-content:center" data-hamburger><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    </div>
  </nav>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--k-bg) 96%,transparent);backdrop-filter:blur(6px);padding:22px">
      <div style="display:flex;align-items:center;margin-bottom:30px"><span style="font:800 19px Inter">Kuber</span><div style="flex:1"></div><button onClick="{{ closeMenu }}" aria-label="Close" style="background:var(--k-muted);border:1px solid var(--k-border);border-radius:8px;width:40px;height:40px;color:var(--k-text);cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="margin-top:2px"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div style="display:flex;flex-direction:column;gap:6px"><a href="Features.dc.html" style="font:700 26px Inter;color:var(--k-text);padding:8px 0">Features</a><a href="Docs.dc.html" style="font:700 26px Inter;color:var(--k-text);padding:8px 0">Docs</a><a href="Changelog.dc.html" style="font:700 26px Inter;color:var(--k-text);padding:8px 0">Changelog</a><a href="About.dc.html" style="font:700 26px Inter;color:var(--k-text);padding:8px 0">About</a><a href="Press.dc.html" style="font:700 26px Inter;color:var(--k-text);padding:8px 0">Press</a></div>
    </div>
  </sc-if>

  <header style="max-width:820px;margin:0 auto;padding:56px 22px 20px">
    <div style="font:700 12px Inter;letter-spacing:1.6px;color:var(--k-accent-text);margin-bottom:12px">CHANGELOG</div>
    <h1 style="font:900 52px Inter;letter-spacing:-2.2px;line-height:1;margin:0">What's new</h1>
    <p style="font:400 17px/1.6 Inter;color:var(--k-text-sec);margin:14px 0 0;max-width:480px">Every release, newest first. No account, no cloud, no surprises.</p>
  </header>

  <section style="max-width:820px;margin:0 auto;padding:20px 22px 60px">
    <div style="display:flex;flex-direction:column" data-entries>
      <sc-for list="{{ entries }}" as="e" hint-placeholder-count="4">
        <div style="display:grid;grid-template-columns:150px 1fr;gap:24px;padding:26px 0;border-top:1px solid var(--k-border)" data-entry>
          <div>
            <div style="font:600 13px 'JetBrains Mono',monospace;color:var(--k-text-sec)">{{ e.date }}</div>
            <div style="display:inline-flex;align-items:center;margin-top:10px;font:700 12px 'JetBrains Mono',monospace;color:var(--k-accent-text);background:var(--k-accent-subtle);border:1px solid var(--k-accent-ring);border-radius:6px;padding:4px 9px">v{{ e.version }}</div>
          </div>
          <div>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="font:800 22px Inter;letter-spacing:-.5px;margin:0">{{ e.title }}</h2><sc-if value="{{ e.latest }}" hint-placeholder-val="{{ false }}"><span style="font:700 9px Inter;letter-spacing:.6px;color:var(--k-on-accent);background:var(--k-accent);border-radius:5px;padding:3px 7px">LATEST</span></sc-if></div>
            <p style="font:400 15px/1.7 Inter;color:var(--k-text-sec);margin:12px 0 0">{{ e.summary }}</p>
            <ul style="font:400 15px/1.8 Inter;color:var(--k-text);margin:14px 0 0;padding-left:20px">
              <sc-for list="{{ e.points }}" as="p" hint-placeholder-count="3"><li>{{ p }}</li></sc-for>
            </ul>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="text-align:center;padding-top:34px;border-top:1px solid var(--k-border)">
      <button style="font:600 14px Inter;color:var(--k-text);background:var(--k-card);border:1px solid var(--k-border);border-radius:10px;padding:11px 22px;cursor:pointer">Load older releases</button>
    </div>
  </section>

  <footer style="border-top:1px solid var(--k-border);background:var(--k-card)">
    <div style="max-width:820px;margin:0 auto;padding:34px 22px;display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center">
      <div style="display:flex;align-items:center;gap:10px"><svg width="26" height="26" viewBox="0 0 512 512" style="border-radius:6px"><rect width="512" height="512" fill="var(--k-tile)"/><circle cx="256" cy="256" r="190" fill="var(--k-accent)"/><path fill="var(--k-tile)" d="M176 150H335V172H176ZM176 199H335V222H176ZM202 245H306L247 275H202ZM202 275H247L326 360L280 361Z"/></svg><span style="font:800 17px Inter">Kuber</span></div>
      <div style="flex:1"></div>
      <a href="{{ ghUrl }}" target="_blank" rel="noopener" style="font:500 13.5px Inter;color:var(--k-text-sec)">Releases on GitHub</a>
      <span style="font:500 12.5px Inter;color:var(--k-text-sec)">Made in India <span style="color:var(--k-expense)">♥</span></span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { variant: 'signature', mode: 'dark', menuOpen: false, themeMenuOpen: false };
  LABELS = { signature: 'Blue', flewtube: 'Red', woofsapp: 'Green', purrhub: 'Yellow', honkpe: 'Purple', squeakdin: 'Navy', oinkzon: 'Orange' };
  META = [
    { id: 'signature', name: 'Kuber Signature', dark: '#3B82F6', light: '#3B82F6' },
    { id: 'flewtube', name: 'FlewTube', dark: '#E5484D', light: '#C41E3A' },
    { id: 'woofsapp', name: 'Woofsapp', dark: '#1FB855', light: '#15803D' },
    { id: 'purrhub', name: 'Purrhub', dark: '#FACC15', light: '#A16207' },
    { id: 'honkpe', name: 'Honkpe', dark: '#8B5CF6', light: '#6D28D9' },
    { id: 'squeakdin', name: 'Squeakdin', dark: '#4A7FD1', light: '#1E3A8A' },
    { id: 'oinkzon', name: 'Oinkzon', dark: '#FB923C', light: '#C2410C' },
  ];
  async componentDidMount() { try { const m = await import('./kuber-theme.js'); this._t = m; const p = m.readPref(); this.setState({ variant: p.variant, mode: p.mode }, () => this._apply()); } catch (e) {} }
  _root() { return document.getElementById('kuber-root'); }
  _apply() { if (this._t) this._t.applyTheme(this._root(), this.state.variant, this.state.mode); }
  setVariant = (id) => this.setState({ variant: id, themeMenuOpen: false }, () => { this._apply(); this._save(); });
  setMode = (mode) => this.setState({ mode }, () => { this._apply(); this._save(); });
  _save() { if (this._t) this._t.savePref(this.state.variant, this.state.mode); }
  toggleMenu = () => this.setState(s => ({ menuOpen: !s.menuOpen }));
  closeMenu = () => this.setState({ menuOpen: false });
  toggleThemeMenu = () => this.setState(s => ({ themeMenuOpen: !s.themeMenuOpen }));
  closeThemeMenu = () => this.setState({ themeMenuOpen: false });
  renderVals() {
    const { variant, mode, menuOpen } = this.state;
    const modeBtn = (on) => `flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font:600 12px Inter;padding:8px 6px;border-radius:9px;cursor:pointer;color:${on ? 'var(--k-accent-text)' : 'var(--k-text-sec)'};background:${on ? 'var(--k-accent-subtle)' : 'transparent'};border:1px solid ${on ? 'var(--k-accent-ring)' : 'var(--k-border)'}`;
    const active0 = this.META.find(t => t.id === variant) || this.META[0];
    const curColor = mode === 'light' ? active0.light : active0.dark;
    const themes = this.META.map(t => { const color = mode === 'light' ? t.light : t.dark; const active = t.id === variant; return { id: t.id, name: t.name, color, select: () => this.setVariant(t.id), label: this.LABELS[t.id], rowStyle: `display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid ${active ? 'var(--k-accent-ring)' : 'transparent'};background:${active ? 'var(--k-accent-subtle)' : 'transparent'}`, dotStyle: `width:18px;height:18px;border-radius:999px;background:${color};cursor:pointer;padding:0;border:2px solid ${active ? 'var(--k-text)' : 'var(--k-border)'};${active ? 'transform:scale(1.18);' : ''}` }; });
    return {
      themes, menuOpen, toggleMenu: this.toggleMenu, closeMenu: this.closeMenu,
      setLight: () => this.setMode('light'), setDark: () => this.setMode('dark'),
      lightBtnStyle: modeBtn(mode === 'light'), darkBtnStyle: modeBtn(mode === 'dark'),
      themeMenuOpen: this.state.themeMenuOpen, toggleThemeMenu: this.toggleThemeMenu, closeThemeMenu: this.closeThemeMenu, currentSwatch: curColor, currentName: active0.name,
      ghUrl: 'https://github.com/singhgautam7/Kuber/',
      entries: [
        { date: 'March 2026', version: '5.1.0+53', title: 'Kuber Pro launch', latest: true, summary: 'Kuber Pro is here. Unlock SMS Import, Advanced Analytics, unlimited Kuber Notes and Cards, Reminders, automatic backups, Multi-currency and custom accent themes. Start with a 14-day free trial on the yearly plan, or go Lifetime once.', points: ['Pro gating is now live across all 9 gated features. Kuber Signature stays free in light and dark; the other accent families are Pro.', 'Restore purchases and Google Play promo-code redemption from Settings.', 'Launch offers configured in Play Console are surfaced and applied automatically on the yearly plan.', 'No account, no cloud. Cancel anytime through Google Play.'] },
        { date: 'January 2026', version: '4.6.0', title: 'Personalization themes', latest: false, summary: 'Seven accent families across Obsidian and Alabaster, plus a redesigned appearance section in Settings.', points: ['Seven theme families with light and dark variants.', 'Modern and standard bottom navigation styles.', 'Redesigned More tab with a hero layout option.'] },
        { date: 'November 2025', version: '4.0.0', title: 'Ask Kuber and Voice Quick Add', latest: false, summary: 'Natural language and voice entry arrive, parsed entirely on-device.', points: ['Type a sentence to draft a transaction.', 'Hold to speak and log hands-free.', 'Multi-transaction detection from a single input.'] },
        { date: 'August 2025', version: '3.2.0', title: 'Analytics and insights', latest: false, summary: 'Deeper analytics with auto-generated insights on your spending.', points: ['Category and tag breakdowns.', 'Weekday vs weekend patterns.', 'Month-over-month comparisons.'] },
      ],
    };
  }
}
</script>
</body>
</html>
